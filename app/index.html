<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pliable</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1b1d22; color: #ddd; font: 13px system-ui, sans-serif; overflow: hidden; }
      #viewport { position: fixed; inset: 0; }
      #viewport.engaged::after { content: ""; position: absolute; inset: 0; border: 2px solid rgba(255, 138, 31, 0.45); pointer-events: none; z-index: 1; }
      #bar { position: fixed; top: 0; left: 0; right: 0; box-sizing: border-box; padding: 6px 52px 6px 8px; display: flex; gap: 6px; align-items: center; z-index: 3; flex-wrap: nowrap; background: rgba(27, 29, 34, 0.88); border-bottom: 1px solid #2d3038; white-space: nowrap; }
      .icon { display: inline-flex; vertical-align: middle; margin-right: 5px; }
      #bar button .icon, #tools button .icon { margin-right: 5px; }
      #bar .searchicon { margin: 0 -26px 0 6px; color: #888; pointer-events: none; z-index: 1; }
      #palette-input { padding-left: 28px !important; }
      #toollist button { display: flex; align-items: center; }
      #bar #status { flex: 1; min-width: 40px; overflow: hidden; text-overflow: ellipsis; }
      #menuwrap { position: relative; }
      #menupanel { position: absolute; top: 34px; left: 0; z-index: 6; background: #23262d; border: 1px solid #444; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 190px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); }
      #menupanel[hidden] { display: none; }
      #menupanel .group { color: #ffb878; font-size: 11px; margin-top: 2px; }
      #bar #menupanel button, #bar #menupanel select { text-align: left; }
      #palette-input { width: 190px; box-sizing: border-box; padding: 4px 8px; background: #1b1d22; color: #eee; border: 1px solid #444; border-radius: 4px; font: inherit; outline: none; }
      #palette-input:focus { width: 300px; border-color: #ff8a1f; }
      #gear { position: fixed; right: 8px; top: 5px; z-index: 4; background: #2a2d34; color: #ddd; border: 1px solid #444; border-radius: 4px; font-size: 18px; padding: 2px 8px; }
      #settingspanel { position: fixed; right: 8px; top: 44px; z-index: 4; background: #23262d; color: #ddd; border: 1px solid #444; border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; width: 230px; font-size: 13px; }
      #settingspanel[hidden] { display: none; }
      #settingspanel label { display: flex; flex-direction: column; gap: 2px; }
      #settingspanel label:has(input[type=checkbox]) { flex-direction: row; gap: 6px; }
      #toolform .eyedropper { padding: 0 6px; } #toolform .eyedropper.armed { background: #ff8a1f; color: #000; }
      #bar span:empty { display: none; }
      #bar button { background: #2a2d34; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 4px 8px; }
      #bar span.error { color: #ff8c8c; border-color: #a44; }
      #bar button:disabled { opacity: 0.4; }
      #bar button.active { border-color: #ff8a1f; color: #ffb878; }
      #bar select, #bar span { background: #2a2d34; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 4px 8px; }
      #tools { position: fixed; top: 52px; left: 50%; transform: translateX(-50%); max-width: min(980px, calc(100vw - 340px)); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; align-items: center; z-index: 2; background: rgba(35, 38, 45, 0.92); border: 1px solid #3a3e47; border-radius: 8px; padding: 5px 6px; }
      #tools button { background: #2a2d34; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 4px 10px; }
      #tools button.active { border-color: #ff8a1f; color: #ffb878; }
      #tools button.active::after { content: "drag"; margin-left: 6px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; color: #ff8a1f; }
      #tools button.more { color: #aaa; }
      #tools .none { color: #888; padding: 4px 2px; }
      #busy { position: fixed; top: 44px; left: 8px; z-index: 3; display: flex; gap: 8px; align-items: center; background: #23262d; color: #ffb878; border: 1px solid #ff8a1f; border-radius: 4px; padding: 4px 10px; font-variant-numeric: tabular-nums; pointer-events: none; }
      #busy[hidden] { display: none; }
      #busy i { width: 12px; height: 12px; border: 2px solid #ff8a1f; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #dim { white-space: pre; position: fixed; z-index: 2; pointer-events: none; background: #23262d; color: #ffb878; border: 1px solid #ff8a1f; border-radius: 4px; padding: 2px 8px; font-variant-numeric: tabular-nums; }
      #dim.entry { background: #343944; color: #fff; }
      #dim[hidden] { display: none; }
      .navcube { position: fixed; top: 80px; right: 12px; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .navcube-scene { perspective: 400px; margin: 14px 14px 18px; }
      .navcube-cube { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }
      .navcube-face { position: absolute; text-align: center; font-size: 11px; color: #cfd6e4; background: rgba(60, 68, 84, 0.85); border: 1px solid #7d8aa5; box-sizing: border-box; cursor: pointer; user-select: none; }
      .navcube-face:hover { background: rgba(255, 138, 31, 0.8); color: #fff; }
      .viewctl { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
      .viewctl button { background: #2a2d34; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 4px 8px; font: inherit; cursor: pointer; }
      .viewctl button { min-width: 30px; height: 28px; display: inline-flex; align-items: center; justify-content: center; }
      .viewctl button .icon { margin: 0; }
      .viewctl button:hover { border-color: #888; }
      .viewctl button.active { border-color: #ff8a1f; color: #ffb878; }
      #drawer { position: fixed; top: 48px; left: 0; bottom: 0; width: 280px; z-index: 5; background: rgba(35, 38, 45, 0.97); border-right: 1px solid #444; display: flex; flex-direction: column; box-shadow: 4px 0 18px rgba(0, 0, 0, 0.4); }
      #drawer[hidden] { display: none; }
      #drawerbtn { position: fixed; left: 0; top: calc(50% + 24px); transform: translateY(-50%); width: 28px; height: 48px; box-sizing: border-box; z-index: 4; display: flex; align-items: center; justify-content: center; gap: 1px; padding: 0; background: #2a2d34; color: #ddd; border: 1px solid #444; border-left: none; border-radius: 0 8px 8px 0; cursor: pointer; }
      #drawerbtn[aria-expanded="true"] { left: 280px; border-color: #ff8a1f; color: #ffb878; box-shadow: 4px 0 12px rgba(0, 0, 0, 0.3); }
      #drawerbtn:hover { background: #343944; }
      #drawerbtn:focus-visible { outline: 2px solid #ff8a1f; outline-offset: -2px; }
      #drawerbtn .icon { margin: 0; }
      #drawer .drawerhead { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-bottom: 1px solid #3a3e47; }
      #drawer .drawerhead b { color: #ffb878; flex: 1; }
      #drawer .drawerhead button { background: #2a2d34; color: #ddd; border: 1px solid #444; border-radius: 4px; }
      #drawer.usableonly #toollist > div:not(:has(button:enabled)) { display: none; }
      #drawer.usableonly #toollist button:disabled { display: none; }
      #bodysection { border-top: 1px solid #3a3e47; display: flex; flex-direction: column; max-height: 42%; min-height: 0; }
      #bodyhead { background: none; border: none; color: #ffb878; font-size: 11px; text-align: left; padding: 7px 10px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
      #bodyhead #bodycount { color: #888; }
      #bodyhead .caret::before { content: "▾"; }
      #bodyhead[aria-expanded="false"] .caret::before { content: "▸"; }
      #bodysection:has(#bodyhead[aria-expanded="false"]) #bodylist { display: none; }
      #bodylist { overflow-y: auto; padding: 0 4px 8px; }
      .bodyrow { display: flex; align-items: center; gap: 2px; padding: 2px 6px; border-radius: 3px; color: #ddd; cursor: default; user-select: none; }
      .bodyrow:hover, .bodyrow.hovered { background: #343944; }
      .bodyrow.selected { background: rgba(255, 138, 31, 0.28); color: #fff; }
      .bodyrow.dim .bodyname { color: #777; font-style: italic; }
      .bodyname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .bodybtn { background: none; border: none; color: #999; padding: 2px; border-radius: 3px; cursor: pointer; display: flex; }
      .bodybtn .icon { margin: 0; }
      .bodybtn:hover { color: #fff; background: #444a55; }
      .bodybtn.on { color: #ffb878; }
      .bodyedit { flex: 1; min-width: 0; background: #1d2026; color: #fff; border: 1px solid #ff8a1f; border-radius: 3px; padding: 1px 4px; font: inherit; }
      .bodymenu { position: fixed; z-index: 20; background: #2a2d34; border: 1px solid #444; border-radius: 4px; padding: 3px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45); display: flex; flex-direction: column; min-width: 130px; }
      .bodymenu button { background: none; border: none; color: #ddd; text-align: left; padding: 4px 10px; border-radius: 3px; }
      .bodymenu button:hover:enabled { background: #3b4150; }
      .bodymenu button:disabled { color: #666; }
      #toollist { padding: 4px 10px 16px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex: 1; }
      #toollist .group { color: #ffb878; font-size: 11px; margin-top: 4px; }
      #toollist button, #toolform button { background: #2a2d34; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 3px 8px; text-align: left; display: block; width: 100%; margin-top: 2px; }
      #toollist button:disabled { color: #666; }
      #toolform { position: fixed; top: 104px; left: 44px; z-index: 2; background: #23262d; border: 1px solid #444; border-radius: 6px; padding: 8px 10px; min-width: 200px; }
      #toolform[hidden] { display: none; }
      #toolform .title { color: #ffb878; font-weight: 600; margin-bottom: 4px; }
      #toolform .row { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin: 3px 0; }
      #toolform input { width: 80px; background: #1b1d22; color: #eee; border: 1px solid #555; border-radius: 3px; padding: 2px 4px; }
      #toolform .buttons { display: flex; gap: 6px; margin-top: 6px; }
      #hintline { position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%); z-index: 1; display: flex; gap: 14px; white-space: nowrap; font-size: 11px; color: #8a8f98; pointer-events: none; }
      #hintline kbd { background: #2a2d34; border: 1px solid #3a3e47; border-radius: 3px; padding: 0 4px; margin-right: 3px; color: #bbb; font: inherit; }
      #hinttip { position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%); z-index: 2; display: flex; gap: 8px; align-items: center; background: #23262d; border: 1px solid #ffb878; border-radius: 6px; padding: 6px 10px; font-size: 12px; color: #ddd; }
      #hinttip[hidden], #hintline[hidden] { display: none; }
      #sketchbar { position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); z-index: 1; display: flex; gap: 6px; align-items: center; color: #aaa; }
      #sketchbar button, #sketchpanel button { background: #2a2d34; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 3px 8px; }
      #sketchbar button:disabled { color: #666; }
      #sketchpanel { position: fixed; top: 270px; right: 12px; width: 250px; max-height: calc(100vh - 290px); overflow-y: auto; z-index: 2; background: #23262d; border: 1px solid #444; border-radius: 6px; padding: 8px 10px; font-size: 13px; }
      #sketchpanel[hidden] { display: none; }
      #sketchpanel .title { color: #ffb878; font-weight: 600; }
      #sketchpanel .dof { color: #9ad; margin: 2px 0 6px; }
      #sketchpanel .bad { color: #ff6b6b; }
      #sketchpanel .row-buttons { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
      #sketchpanel .row-buttons button.active { border-color: #ff8a1f; color: #ffb878; }
      #sketchpanel .group { color: #ffb878; font-size: 11px; margin-top: 8px; }
      #sketchpanel .crow { display: flex; justify-content: space-between; gap: 6px; align-items: center; margin: 2px 0; }
      #sketchpanel .ask { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
      #sketchpanel input { width: 70px; background: #1b1d22; color: #eee; border: 1px solid #555; border-radius: 3px; padding: 2px 4px; }
      #sketchpanel select { background: #1b1d22; color: #eee; border: 1px solid #555; border-radius: 3px; }
      #chips { position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%); z-index: 1; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 60vw; }
      #chips button { background: #2a2d34; color: #aaa; border: 1px solid #555; border-radius: 12px; padding: 2px 10px; font-size: 12px; }
      #chips button.all { border-style: dashed; }
      #chips button.on { color: #ffb878; border-color: #ff8a1f; }
      #measure { position: fixed; left: 44px; bottom: 8px; z-index: 1; min-width: 190px; max-height: 60vh; overflow-y: auto; background: #23262d; border: 1px solid #444; border-radius: 6px; padding: 4px 0; font-variant-numeric: tabular-nums; }
      #measure[hidden] { display: none; }
      #measure .title { padding: 4px 10px 2px; color: #ffb878; font-weight: 600; cursor: pointer; }
      #measure .title::after { content: " B8"; color: #8a8f98; }
      #measure:not(.collapsed) .title::after { content: " BE"; }
      #measure.collapsed .section:nth-child(n+2), #measure.collapsed .row:nth-child(n+4) { display: none; }
      #measure .section + .section { border-top: 1px solid #3a3e47; margin-top: 4px; }
      #measure .row { display: flex; justify-content: space-between; gap: 18px; padding: 1px 10px; cursor: pointer; }
      #measure .row:hover { background: #2f333b; }
      #measure .row.copied { background: #3b4a38; }
      #measure .value { color: #fff; }
      #palette { position: fixed; top: 44px; left: 0; z-index: 10; }
      #palette[hidden] { display: none; }
      #palette-box { width: min(520px, 92vw); background: #23262d; border: 1px solid #444; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); }
      #palette-list { max-height: 50vh; overflow-y: auto; }
      #palette .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 14px; cursor: pointer; }
      #palette .row.active { background: #343944; }
      #palette .row.disabled { color: #777; cursor: default; }
      #palette .hint { color: #888; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="viewport"></div>
    <div id="bar">
      <div id="menuwrap">
        <button id="menubtn" title="File, import and export">Menu</button>
        <div id="menupanel" hidden>
          <div class="group">Model</div>
      <select id="demo" title="Open one of the built-in demo models">
        <option>bracket</option>
        <option>block</option>
        <option>perforated_plate</option>
      </select>
      <select id="combinemode" title="What Import STEP does with the file: replace the model, or add the file to the current one">
        <option value="replace">replace model</option>
        <option value="add">add as body</option>
        <option value="union">union</option>
        <option value="cut">cut</option>
        <option value="intersect">intersect</option>
      </select>
      <button id="open" title="Import a STEP file from your computer using the choice on the left. Replace model starts again from the file; the other choices add it to the current model at its own origin">Import STEP</button>
      <input id="file" type="file" accept=".step,.stp" hidden />
      <button id="export" title="Save the current model as a STEP file">Export STEP</button>
      <select id="exportmesh" title="Save the model as a mesh file (lossy: curved faces become triangles)">
        <option value="">Export mesh...</option>
        <option value="stl">STL</option>
        <option value="obj">OBJ</option>
        <option value="3mf">3MF</option>
      </select>
      <button id="info" title="Show the size, face and edge counts and any problems found in the model">Model info</button>
        </div>
      </div>
      <div id="viewbuttons" hidden>
          <button id="seethrough" title="See-through (X): make faces transparent so every edge shows and hidden edges and faces can be picked">X</button>
          <button id="axes" title="Show or hide the principal axes and origin"></button>
      </div>
      <button id="editlast" disabled title="Undo the last operation and change its values">Edit last</button>
      <button id="undo" disabled title="Undo the last change (Ctrl+Z)">Undo</button>
      <button id="redo" disabled title="Redo the change you undid (Ctrl+Y)">Redo</button>
      <span id="status">connecting...</span>
      <button id="reconnect" hidden title="Try to reach the core again now">Reconnect</button>
      <span id="selected"></span>
      <span id="latency"></span>
      <input id="palette-input" title="Search every tool, setting and command (Ctrl+K or /)" placeholder="Search tools (Ctrl+K, ? for shortcuts)" autocomplete="off" spellcheck="false" />
    </div>
    <div id="busy" hidden><i></i><span id="busytext"></span></div>
    <div id="tools"></div>
    <div id="chips"></div>
    <div id="navcube"></div>
    <div id="drawer" hidden>
      <div class="drawerhead">
        <b>All tools</b>
        <label title="Show only the tools that work with the current selection"><input type="checkbox" id="drawerusable" /> usable now</label>
        <button id="drawerclose" title="Close the tool list (Escape)">Close</button>
      </div>
      <div id="toollist"></div>
      <section id="bodysection">
        <button id="bodyhead" type="button" aria-expanded="true" aria-controls="bodylist" title="Show or hide the list of bodies"><span class="caret"></span>Bodies <span id="bodycount">0</span></button>
        <div id="bodylist"></div>
      </section>
    </div>
    <button id="drawerbtn" type="button" aria-label="Tools" aria-expanded="false" aria-controls="drawer" title="Tools (T)&#10;Open or close the list of every tool, grouped."></button>
    <div id="sketchbar"></div>
    <div id="sketchpanel" hidden></div>
    <div id="toolform" hidden></div>
    <div id="measure" hidden></div>
    <div id="dim" hidden></div>
    <div id="palette" hidden>
      <div id="palette-box">
        <div id="palette-list"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
