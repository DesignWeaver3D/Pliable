        html { --handlew: 44px; }
        #tools, .navcube, #bodypanel { top: 52px; } /* the bar is taller here */
        #bar button, #bar select, #tools button, .viewctl button, #gear, #drawer .drawerhead button { min-height: 40px; min-width: 40px; }
        #drawerbtn { width: 40px; height: 56px; }
        #drawerbtn[aria-expanded="true"] { left: 280px; }
        #palette .row { min-height: 40px; box-sizing: border-box; align-items: center; }
        #palette-input { min-height: 40px; }
      }
    </style>
  </head>
  <body>
    <div id="viewport"></div>
    <div id="bar">
      <div id="menuwrap">
        <button id="menubtn" title="File, import and export">Menu</button>
        <div id="menupanel" hidden>
          <button id="gettingstartedbtn" title="Show the six interactions worth knowing first">Getting started</button>
          <div class="group">Project</div>
      <button id="newproject" title="Close the current project and start a completely empty one">New Project</button>
      <button id="openproject" title="Close the current project and open a Pliable project file (.plbl)">Open Project</button>
      <input id="projectfile" type="file" accept=".plbl" hidden />
      <button id="saveproject" title="Save the whole project as a Pliable project file (.plbl): bodies, names and sketches">Save Project</button>
      <button id="openasnew" title="Close the current project and start a new one from a STEP file">Open STEP as New Project</button>
      <input id="file" type="file" accept=".step,.stp" hidden />
      <button id="open" title="Add a STEP file to the project you have now, as a new body at its own origin. Nothing in the current project changes. Use the Boolean tool to join, subtract or intersect bodies afterwards">Import STEP...</button>
      <button id="export" title="Save the current project as a STEP file">Export STEP</button>
      <select id="exportmesh" title="Save the project as a mesh file (lossy: curved faces become triangles)">
        <option value="">Export mesh...</option>
        <option value="stl">STL</option>
        <option value="obj">OBJ</option>
        <option value="3mf">3MF</option>
      </select>
          <div class="group">Sample models (replace the current model)</div>
      <select id="demo" title="Replace the current model with a built-in sample model for trying the tools">
        <option value="" disabled selected hidden>Choose a sample...</option>
        <option>bracket</option>
        <option>block</option>
        <option>perforated_plate</option>
      </select>
        </div>
      </div>
      <div id="viewbuttons" hidden>
          <button id="seethrough" title="See-through (X): make faces transparent so every edge shows and hidden edges and faces can be picked">X</button>
          <button id="axes" title="Show or hide the principal axes and origin"></button>
      </div>
      <button id="editlast" disabled title="Undo the last operation and change its values">Edit last</button>
      <button id="undo" disabled title="Undo the last change (Ctrl+Z)">Undo</button>
      <button id="redo" disabled title="Redo the change you undid (Ctrl+Y)">Redo</button>
      <span id="status">connecting...</span>
      <button id="reconnect" hidden title="Try to reach the core again now">Reconnect</button>
      <span id="selected"></span>
      <span id="latency"></span>
      <input id="palette-input" title="Search every tool, setting and command (Ctrl+K or /)" placeholder="Search tools (Ctrl+K, ? for shortcuts)" autocomplete="off" spellcheck="false" />
    </div>
    <div id="busy" hidden><i></i><span id="busytext"></span></div>
    <div id="tools"></div>
    <div id="chips"></div>
    <div id="navcube"></div>
    <div id="drawer" hidden>
      <div class="drawerhead">
        <b>All tools</b>
        <label title="Show only the tools that work with the current selection"><input type="checkbox" id="drawerusable" /> usable now</label>
      </div>
      <div id="toollist"></div>
    </div>
      <section id="bodypanel" aria-label="Bodies">
        <button id="bodyhead" type="button" aria-expanded="true" aria-controls="bodylist" title="Show or hide the list of bodies"><span class="caret"></span>Bodies <span id="bodycount">0</span></button>
        <div id="bodylist"></div>
        <button id="keptsketchhead" type="button" aria-expanded="true" aria-controls="keptsketches" title="Show or hide the list of kept sketches"><span class="caret"></span>Sketches <span id="keptsketchcount">0</span></button>
        <div id="keptsketches"></div>
        <button id="datumhead" type="button" aria-expanded="true" aria-controls="datumlist" title="Show or hide the list of datum planes"><span class="caret"></span>Datum planes <span id="datumcount">0</span></button>
        <div id="datumlist"></div>
        <div id="mirrorstate" hidden></div>
      </section>
    <button id="drawerbtn" type="button" aria-label="Tools" aria-expanded="false" aria-controls="drawer" title="Tools (T)&#10;Open or close the list of every tool, grouped."></button>
    <div id="sketchbar"></div>
    <div id="sketchpanel" hidden></div>
    <div id="toolform" hidden></div>
    <div id="measure" hidden></div>
    <div id="dim" hidden></div>
    <div id="palette" hidden>
      <div id="palette-box">
        <div id="palette-list"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
