<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pliable</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1b1d22; color: #ddd; font: 13px system-ui, sans-serif; overflow: hidden; }
      #viewport { position: fixed; inset: 0; }
      #bar { position: fixed; top: 8px; left: 8px; display: flex; gap: 6px; align-items: center; z-index: 1; }
      #bar span:empty { display: none; }
      #bar button { background: #2a2d34; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 4px 8px; }
      #bar span.error { color: #ff8c8c; border-color: #a44; }
      #bar button:disabled { opacity: 0.4; }
      #bar select, #bar span { background: #2a2d34; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 4px 8px; }
      #tools { position: fixed; top: 44px; left: 8px; display: flex; gap: 6px; align-items: center; z-index: 1; }
      #tools button { background: #2a2d34; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 4px 10px; }
      #tools button.active { border-color: #ff8a1f; color: #ffb878; }
      #tools .none { color: #888; padding: 4px 2px; }
      #dim { white-space: pre; position: fixed; z-index: 2; pointer-events: none; background: #23262d; color: #ffb878; border: 1px solid #ff8a1f; border-radius: 4px; padding: 2px 8px; font-variant-numeric: tabular-nums; }
      #dim.entry { background: #343944; color: #fff; }
      #dim[hidden] { display: none; }
      #palette { position: fixed; inset: 0; z-index: 10; display: flex; justify-content: center; align-items: flex-start; padding-top: 14vh; background: rgba(0, 0, 0, 0.35); }
      #palette[hidden] { display: none; }
      #palette-box { width: min(520px, 92vw); background: #23262d; border: 1px solid #444; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); }
      #palette-input { width: 100%; box-sizing: border-box; padding: 12px 14px; background: #1b1d22; color: #eee; border: 0; border-bottom: 1px solid #444; font: inherit; font-size: 15px; outline: none; }
      #palette-list { max-height: 50vh; overflow-y: auto; }
      #palette .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 14px; cursor: pointer; }
      #palette .row.active { background: #343944; }
      #palette .row.disabled { color: #777; cursor: default; }
      #palette .hint { color: #888; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="viewport"></div>
    <div id="bar">
      <select id="demo">
        <option>bracket</option>
        <option>block</option>
        <option>perforated_plate</option>
      </select>
      <button id="open">Open STEP</button>
      <button id="export">Export STEP</button>
      <input id="file" type="file" accept=".step,.stp" hidden />
      <button id="undo" disabled>Undo</button>
      <button id="redo" disabled>Redo</button>
      <span id="status">connecting...</span>
      <span id="selected"></span>
      <span id="latency"></span>
    </div>
    <div id="tools"></div>
    <div id="dim" hidden></div>
    <div id="palette" hidden>
      <div id="palette-box">
        <input id="palette-input" placeholder="Type a command (Esc to close)" autocomplete="off" spellcheck="false" />
        <div id="palette-list"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
