# Rejects pushes and pull requests whose commit messages break the rules in
# scripts/check_commit_message.py and file contents against scripts/check_content.py
# (no product names, clear subject, body for big changes).
name: commit-lint

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}..HEAD"
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }}~1..${{ github.sha }}"
          fi
          python scripts/check_commit_message.py --range "$range"
      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/check_commit_message.py --pr-title "$PR_TITLE" --pr-number "$PR_NUMBER"
      - name: Check file contents
        run: python scripts/check_content.py --all
