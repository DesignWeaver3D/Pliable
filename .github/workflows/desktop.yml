# Desktop shell (Tauri): freeze the core, build the shell, assemble the portable archive and smoke-test it.
# Manual only: start it from the Actions tab to build and smoke-test the portable desktop archives on a branch.
name: desktop

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64 }
          - { os: macos-latest, label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x64 }
          - { os: ubuntu-24.04, label: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev xvfb
      - name: Build the frontend
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Freeze the core
        working-directory: core
        run: |
          uv sync
          uv pip install pyinstaller
          uv run python scripts/build_app.py ${{ matrix.label }}
      - name: Install the Tauri command line tool
        working-directory: desktop
        run: npm ci
      - name: Assemble the portable desktop app
        run: uv run --project core python scripts/build_desktop.py ${{ matrix.label }}
      - name: Unpack the archive and smoke-test the shell
        shell: bash
        run: |
          mkdir smoke && cd smoke
          unzip -q ../desktop/dist/pliable-desktop-${{ matrix.label }}.zip
          EXE="$(pwd)/pliable-desktop-${{ matrix.label }}/Pliable"; [ -f "$EXE.exe" ] && EXE="$EXE.exe"
          cd ../core
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a uv run python scripts/smoke.py desktop "$EXE"; else uv run python scripts/smoke.py desktop "$EXE"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: pliable-desktop-${{ matrix.label }}
          path: desktop/dist/pliable-desktop-${{ matrix.label }}.zip
