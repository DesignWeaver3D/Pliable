# Alpha release: on a version tag, build the portable desktop app (Tauri shell plus frozen core) on each OS,
# smoke-test the packaged build, and attach the archives to a draft release. The draft is never published automatically;
# publish it by hand after checking the archives. See docs/progress.md (alpha release is deferred).
name: release

on:
  push:
    tags: ["v*"]
    branches: ["release/**"]   # build and smoke-test only; publishing needs a tag
  workflow_dispatch: {}   # manual run: builds and smoke-tests, never publishes

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  docs-check:
    # The archives ship the README, license and notices, so they must be right before anything is built.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the release documents (and that the tag matches the version)
        run: python scripts/check_release_docs.py "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"

  create-draft:
    runs-on: ubuntu-latest
    needs: [docs-check]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --prerelease --title "Pliable $GITHUB_REF_NAME (alpha)" --notes-file docs/release-notes.md

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64 }
          - { os: macos-latest, label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x64 }
          - { os: ubuntu-24.04, label: linux-x64 }
    runs-on: ${{ matrix.os }}
    needs: [docs-check, create-draft]
    if: always() && needs.docs-check.result == 'success' && (needs.create-draft.result == 'success' || needs.create-draft.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev xvfb
      - name: Build the frontend
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Install the core and PyInstaller
        working-directory: core
        run: |
          uv sync
          uv pip install pyinstaller
      - name: Run the core tests
        working-directory: core
        run: uv run pytest -q
      - name: Freeze the core
        working-directory: core
        run: uv run python scripts/build_app.py ${{ matrix.label }}
      - name: Install the Tauri command line tool
        working-directory: desktop
        run: npm ci
      - name: Assemble the portable desktop app
        run: uv run --project core python scripts/build_desktop.py ${{ matrix.label }}
      - name: Unpack the archive and smoke-test the shell
        shell: bash
        run: |
          mkdir smoke && cd smoke
          unzip -q ../desktop/dist/pliable-desktop-${{ matrix.label }}.zip
          EXE="$(pwd)/pliable-desktop-${{ matrix.label }}/Pliable"; [ -f "$EXE.exe" ] && EXE="$EXE.exe"
          cd ../core
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a uv run python scripts/smoke.py desktop "$EXE"; else uv run python scripts/smoke.py desktop "$EXE"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: pliable-desktop-${{ matrix.label }}
          path: desktop/dist/pliable-desktop-${{ matrix.label }}.zip
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" desktop/dist/pliable-desktop-${{ matrix.label }}.zip --clobber

  ready:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success'
    steps:
      - name: Leave the release as a draft
        run: |
          echo "All builds passed their smoke tests. The release $GITHUB_REF_NAME stays a draft."
          echo "Check the attached archives, then publish it by hand from the Releases page."
