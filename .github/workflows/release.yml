# Alpha release: on a version tag, build the portable app on each OS, smoke-test the packaged build,
# and publish the GitHub release only if every OS passed. See docs/progress.md (S17).
name: release

on:
  push:
    tags: ["v*"]
    branches: [rebuild]   # build and smoke-test only; publishing needs a tag
  workflow_dispatch: {}   # manual run: builds and smoke-tests, never publishes

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  create-draft:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --prerelease --title "Pliable $GITHUB_REF_NAME (alpha)" --notes-file docs/release-notes.md

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64 }
          - { os: macos-latest, label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x64 }
          - { os: ubuntu-latest, label: linux-x64 }
    runs-on: ${{ matrix.os }}
    needs: [create-draft]
    if: always() && (needs.create-draft.result == 'success' || needs.create-draft.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: astral-sh/setup-uv@v5
      - name: Build the frontend
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Install the core and PyInstaller
        working-directory: core
        run: |
          uv sync
          uv pip install pyinstaller
      - name: Run the core tests
        working-directory: core
        run: uv run pytest -q
      - name: Freeze the app
        working-directory: core
        run: uv run python scripts/build_app.py ${{ matrix.label }}
      - name: Unpack the archive and smoke-test the packaged launcher
        shell: bash
        run: |
          mkdir smoke && cd smoke
          unzip -q ../core/dist/pliable-${{ matrix.label }}.zip
          EXE=pliable/pliable; [ -f "$EXE.exe" ] && EXE="$EXE.exe"
          cd ../core && uv run python scripts/smoke.py "$(cd ../smoke && pwd)/$EXE"
      - uses: actions/upload-artifact@v4
        with:
          name: pliable-${{ matrix.label }}
          path: core/dist/pliable-${{ matrix.label }}.zip
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" core/dist/pliable-${{ matrix.label }}.zip --clobber

  publish:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Publish the draft (all smoke tests passed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
