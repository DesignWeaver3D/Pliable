# Compiles the desktop shell when it changes. Not a required check (it only runs for changes under desktop/).
name: ci-desktop

on:
  pull_request:
    paths: ["desktop/**", ".github/workflows/ci-desktop.yml"]

jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the Linux webview libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Compile the shell
        working-directory: desktop/src-tauri
        run: cargo check --locked
