# Core tests, app tests, type check, app build and the release-document check.
# Every pull request runs them on Linux; make the checks named core, app and docs required in the branch protection
# rules for main. macOS and Windows runners are scarce, so those runs (named with their system) happen on pushes to
# main, once a week, when started by hand, and on a pull request that carries the full-ci label.
# Run `python scripts/check.py` before pushing to get the same suites on your own computer.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(format('[
            {{"os": "ubuntu-latest", "name": "core"}}{0}
          ]', (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
          && ', {"os": "macos-latest", "name": "core (macOS)"}, {"os": "windows-latest", "name": "core (Windows)"}' || '')) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - name: Core tests
        working-directory: core
        shell: bash
        run: |
          uv sync
          uv run pytest -q

  app:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(format('[
            {{"os": "ubuntu-latest", "name": "app"}}{0}
          ]', (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
          && ', {"os": "macos-latest", "name": "app (macOS)"}, {"os": "windows-latest", "name": "app (Windows)"}' || '')) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Type check
        working-directory: app
        run: npx tsc --noEmit
      - name: Tests
        working-directory: app
        run: npm test
      - name: Build
        working-directory: app
        run: npm run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Release documents match the version and the dependency lock files
        run: python scripts/check_release_docs.py
