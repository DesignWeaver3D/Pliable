[project]
name = "pliable"
version = "0.4.0"
description = "Direct BREP modeler: Python geometry core"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.14"
dependencies = [
    "build123d>=0.13",
    "rhino3dm>=8.17",
    "py-slvs>=1.0.6",
    "websockets>=15",
]

[project.optional-dependencies]
ifc = ["ifcopenshell>=0.8"]  # LGPL-3.0, about 120 MB installed; only .ifc files need it

[project.scripts]
pliable-server = "pliable.server:main"
pliable-app = "pliable.launcher:main"

[dependency-groups]
dev = ["pytest>=8", "ifcopenshell>=0.8"]  # tests cover .ifc

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
